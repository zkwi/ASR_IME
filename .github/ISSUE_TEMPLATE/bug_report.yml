name: Bug report
description: Report a reproducible VoxType problem.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please do not paste real API keys, personal hotwords, transcripts, local context, raw logs, or full Windows username paths.
  - type: input
    id: version
    attributes:
      label: Version
      description: VoxType version or commit hash.
      placeholder: "0.1.50"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Recording / microphone
        - Doubao ASR
        - LLM polishing
        - Clipboard / paste
        - Hotkey / mouse trigger
        - Floating captions
        - Tray / startup
        - Update / installer
        - UI / settings
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened?
      description: Describe the visible behavior and any redacted error message.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. Press ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        Windows version:
        Install method:
        Microphone:
        Paste target app:
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed real keys, transcripts, hotwords, prompts, logs with sensitive content, and local username paths.
          required: true

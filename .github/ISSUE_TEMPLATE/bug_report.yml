name: Bug report
description: Report a reproducible VoxType problem.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please search existing Issues and the Wiki first. Do not paste real API keys, personal hotwords, transcripts, prompts, local context, raw logs, or full Windows username paths.
  - type: checkboxes
    id: before-reporting
    attributes:
      label: Before reporting
      options:
        - label: I searched existing Issues and the Troubleshooting Wiki.
          required: true
        - label: I included the smallest redacted reproduction details I can provide.
          required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: VoxType version or commit hash.
      placeholder: "0.1.50"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Recording / microphone
        - Doubao ASR
        - LLM polishing
        - Clipboard / paste
        - Hotkey / mouse trigger
        - Floating captions
        - Tray / startup
        - Update / installer
        - UI / settings
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened?
      description: Describe the visible behavior and any redacted error message.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. Press ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        Windows version:
        Install method:
        Microphone:
        Paste target app:
    validations:
      required: false
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics
      description: Optional. Paste only short, redacted errors or diagnostics that do not expose keys, transcripts, hotwords, prompts, local context, raw logs, or username paths.
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed real keys, transcripts, hotwords, prompts, logs with sensitive content, and local username paths.
          required: true

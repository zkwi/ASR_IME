name: Feature request
description: Suggest a focused VoxType improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please search existing Issues, the Wiki, and ROADMAP.md first. VoxType prioritizes focused Windows reliability work over speculative frameworks. Do not include real API keys, transcripts, personal hotwords, prompts, local context, raw logs, or Windows username paths.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Keep it practical and lightweight for a personal desktop app.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What observable result would make this request complete?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Recording / microphone
        - Doubao ASR
        - Alibaba Cloud ASR
        - LLM polishing
        - Clipboard / paste
        - Hotkey / mouse trigger
        - Floating captions
        - Tray / startup
        - Update / installer
        - UI / settings
        - Documentation
        - Other
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: I searched existing Issues and the Wiki before opening this request.
          required: true
        - label: I understand this project prefers small, dependency-light changes.
          required: true
        - label: I described any privacy, logs, clipboard, hotkeys, tray, updates, or config-default impact above.
          required: true

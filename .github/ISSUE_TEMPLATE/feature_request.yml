name: Feature request
description: Suggest a focused VoxType improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please search existing Issues and the Wiki first. Do not include real API keys, transcripts, personal hotwords, prompts, local context, raw logs, or Windows username paths.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Keep it practical and lightweight for a personal desktop app.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Recording / microphone
        - Doubao ASR
        - LLM polishing
        - Clipboard / paste
        - Hotkey / mouse trigger
        - Floating captions
        - Tray / startup
        - Update / installer
        - UI / settings
        - Documentation
        - Other
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: I searched existing Issues and the Wiki before opening this request.
          required: true
        - label: I understand this project prefers small, dependency-light changes.
          required: true
        - label: This may affect privacy, logs, clipboard, hotkeys, tray, updates, or config defaults.
          required: false
